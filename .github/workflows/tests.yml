name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etl" --health-interval 5s --health-retries 10
    env:
      DB_USER: etl
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests + PostgreSQL integration tests
        run: python -m pytest -q
      - name: Live run against the World Bank API, loading into PostgreSQL twice
        run: |
          python -m wb_etl --destination postgres
          python -m wb_etl --destination postgres
          head -n 6 data/processed/NY.GDP.PCAP.CD.csv
          cat data/processed/NY.GDP.PCAP.CD_quality.json
      - name: No credentials in the logs
        run: "! grep -r ci-only-password logs/"
